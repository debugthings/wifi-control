# NGINX reverse proxy for WiFi Control
# Install on your edge proxy (e.g. bookshelf.internal.debugthings.com)
# Adjust upstream IP to your LXC running wifi-control on port 3002.

server {
    listen 80;
    server_name wifi.debugthings.com;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

